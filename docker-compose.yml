services:
  pipeline:
    build: .
    container_name: csv-pipeline
    volumes:
      - ./incoming:/app/incoming
      - ./processed:/app/processed
      - ./archive:/app/archive
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_INTERVAL=10
    command: python pipeline.py --watch --interval 10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pipeline.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
